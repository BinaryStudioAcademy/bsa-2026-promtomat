services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in apps/backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in apps/backend/.env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in apps/backend/.env}
    ports:
      - "${DB_PORT:?set DB_PORT in apps/backend/.env}:5432"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
