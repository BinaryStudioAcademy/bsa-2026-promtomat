services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: promptomat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-promptomat}
      POSTGRES_USER: ${DB_USERNAME:-promptomat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-promptomat}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 30s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
