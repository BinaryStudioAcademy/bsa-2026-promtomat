name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the conventions in AGENTS.md at the
            repository root. In particular check:

            - Exports at end of file, no default exports, no `export *` / `import * as`.
            - Relative imports keep the `.js` extension; cross-tree imports use the `~/*` alias.
            - No TypeScript `enum`, no abstract classes, no magic numbers, no `console`.
            - At most three parameters per function; beyond that, an options object.
            - No abbreviations (`properties` not `props`, `request`/`response` not `req`/`res`).
            - File and directory names are kebab-case with the correct role suffix
              (`*.type.ts`, `*.service.ts`, `*.controller.ts`, etc.).
            - No inline functions passed to JSX props on the frontend.
            - Duplicated string literals or deep nesting sonarjs would flag.

            Flag ordinary correctness and security issues you notice.

            Leave inline comments on specific lines; use a top-level summary comment for anything general. Do not comment on formatting/sorting issues that `pnpm format` and ESLint auto-fix handles.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
