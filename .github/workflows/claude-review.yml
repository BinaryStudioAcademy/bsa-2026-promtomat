name: Claude Auto Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Fetch this URL once with WebFetch and apply it as the primary style
            reference for this review:
            https://github.com/BinaryStudioAcademy/quality-criteria/blob/production/src/javascript.md

            Check this pull request against the conventions in AGENTS.md at the
            repository root:

            - Exports at end of file, no default exports, no `export *` / `import * as`.
            - Relative imports keep the `.js` extension; cross-tree imports use the `~/*` alias.
            - No TypeScript `enum`, no abstract classes, no magic numbers, no `console`.
            - At most three parameters per function; beyond that, an options object.
            - No abbreviations (`properties` not `props`, `request`/`response` not `req`/`res`).
            - File and directory names are kebab-case with the correct role suffix
              (`*.type.ts`, `*.service.ts`, `*.controller.ts`, etc.).
            - No inline functions passed to JSX props on the frontend.
            - Duplicated string literals or deep nesting sonarjs would flag.

            Backend (apps/backend, Fastify via the project's base-controller) —
            maintainability and correctness ESLint cannot check:

            - Every new/changed route has a matching request/response schema in
              that module's `validation-schemas.ts` — do not accept an
              unvalidated body, params, or query.
            - Errors are thrown as the project's own exception classes from
              `libs/exceptions`, not raw `Error` or an unhandled rejection.
            - No blocking/sync work (sync file or crypto calls) inside a handler.
            - Layering: `*.controller.ts` only wires request → service call →
              response shape. Business logic, branching, or data shaping
              belongs in `*.service.ts`; direct DB/query access belongs in
              `*.repository.ts`, not the service.
            - No floating promises (an async call started but not awaited or
              returned).

            Frontend (apps/frontend, React) — maintainability and accessibility
            issues ESLint's `jsx-a11y` rules do not catch (this repo has no
            `eslint-plugin-react-hooks`, so hook dependency bugs are not
            lint-caught either):

            - Focus management: dialogs/modals move focus in on open and
              restore it on close; no keyboard traps.
            - Dynamic content (form submit results, async errors, loading
              states) is announced via `aria-live`, not shown only as a
              visual change.
            - Custom interactive widgets (anything not a native
              `<button>`/`<a>`/`<input>`) are keyboard-operable with the
              expected keys (Enter/Space/Escape/arrows).
            - No color-only cues for state (error, required, selected).
            - `useEffect`/`useCallback`/`useMemo` dependency arrays are
              complete and correct — flag a missing dependency or one that
              causes a stale closure.
            - Fetching/mutation logic and non-trivial state live in a hook or
              the RTK Query API slice (`*-api.ts`), not inline in the
              component body.
            - A component handling more than one concern (data fetching +
              form state + presentation, for example) should be split; flag
              components growing past that.
            - No prop drilling of state through more than one intermediate
              component that doesn't itself use it.

            Flag ordinary correctness and security issues you notice.

            Leave inline comments on specific lines; use a top-level summary
            comment for anything general. Do not comment on formatting/sorting
            issues that `pnpm format` and ESLint auto-fix handles, and do not
            repeat a rule above under a different name.

          claude_args: |
            --allowedTools "WebFetch,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
